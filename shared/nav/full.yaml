# Full-feature navigation profile for the simulation (ROS 2 Humble).
# Laid over params.yaml: sections here replace or extend the base values.
# The robot walks sideways as well as forward, so the controller plans omnidirectional motion.
#
# Speeds come from tests/scenarios/walking_sweep.py: the walking policy tracks
# 1.0 m/s forward, 0.4 m/s sideways and 1.0 rad/s; the limits below leave margin.
# While walking the body covers about 0.57 m x 0.58 m of floor, hence the 0.30 m radius.

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Omni
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1
      vx_std: 0.2
      vy_std: 0.15
      wz_std: 0.4
      vx_max: 0.8
      vx_min: -0.3
      vy_max: 0.35
      wz_max: 0.8
      prune_distance: 2.5
      transform_tolerance: 0.3
      temperature: 0.3
      gamma: 0.015
      visualize: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      - TwirlingCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.6
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.4
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.4
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.4
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      width: 6
      height: 6
      footprint: null
      robot_radius: 0.30
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.7
        cost_scaling_factor: 4.0

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: null
      robot_radius: 0.30
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.7
        cost_scaling_factor: 4.0

behavior_server:
  ros__parameters:
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5
